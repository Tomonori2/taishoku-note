<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未来ノート（引っこしました）</title>
<meta http-equiv="refresh" content="3; url=https://tomonori2.github.io/mirai-note/">
<link rel="canonical" href="https://tomonori2.github.io/mirai-note/">
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#2b2a27;--sub:#6d6a62;--main:#2f6f62}
@media (prefers-color-scheme: dark){:root{--bg:#191c1b;--card:#232725;--ink:#ece8e0;--sub:#a6a29a;--main:#7fc4b2}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.7;padding:24px 16px}
.card{max-width:520px;margin:40px auto;background:var(--card);border-radius:16px;padding:20px}
a.btn{display:block;text-align:center;background:var(--main);color:#fff;border-radius:12px;padding:14px;font-weight:700;text-decoration:none;margin-top:14px}
.sub{color:var(--sub);font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1 style="font-size:20px;margin:0 0 8px">🌅 「つぎの暮らしノート」は<br>「未来ノート」になりました</h1>
  <div>新しい場所へ自動で移ります。移らないときは、下のボタンを押してください。</div>
  <a class="btn" id="go" href="https://tomonori2.github.io/mirai-note/">未来ノートをひらく</a>
  <div class="sub" style="margin-top:14px">・入れた数字や記録は、そのまま引きつがれます（この端末の中に残っています）。<br>
  ・ホーム画面に置いていた人は、新しい場所を開いてから、もう一度「ホーム画面に追加」してください。</div>
</div>
<script>
// ?tab=money などの続きもそのまま渡す
var to='https://tomonori2.github.io/mirai-note/'+location.search+location.hash;
document.getElementById('go').href=to;
location.replace(to);
</script>
</body>
</html>
